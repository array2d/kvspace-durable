[package]
name = "kvspace-durable"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "可嵌入的 KVSpace（Rust），对齐 kvspace ABI 与线格式；后端 redis/fs/s3"

[lib]
name = "kvspace_durable"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
hmac = "0.13.0"
sha2 = "0.11.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
