name: release-abi
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: 构建
        run: cargo build --release
      - name: 打包 ABI 产物
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME}"
          d="kvspace-durable-abi-$v-linux-x86_64"
          mkdir -p "$d/lib"
          cp target/release/libkvspace_durable.so "$d/lib/"
          ln -sf libkvspace_durable.so "$d/lib/libkvspace_durable.so.1"
          printf '{"abi":"%s"}\n' "$v" > "$d/abi-manifest.json"
          tar czf "$d.tar.gz" "$d"
          sha256sum "$d.tar.gz" > SHA256SUMS
      - name: 发布 release
        run: gh release create "${GITHUB_REF_NAME}" kvspace-durable-abi-*.tar.gz SHA256SUMS --generate-notes
